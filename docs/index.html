<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zwinny AB</title>
  <meta name="description" content="Zwinny AB — For the love of creating">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% 40%, #4ad681 0%, #40cc74 45%, #2fa85c 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    canvas#stage {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    main {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .hero {
      text-align: center;
      padding: 2rem;
      padding-bottom: 16vh;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.9);
      min-height: 1.8em;
      opacity: 0;
    }

    .tagline.typing { opacity: 1; }

    .tagline .cursor {
      display: inline-block;
      width: 2px; height: 1.1em;
      background: rgba(255,255,255,0.8);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink .6s ease infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .divider {
      width: 0; height: 2px;
      background: rgba(255,255,255,0.5);
      margin: 1.8rem auto;
      transition: width .8s cubic-bezier(.16,1,.3,1);
    }

    .divider.visible { width: 50px; }

    .contact {
      opacity: 0; transform: translateY(15px);
      transition: all .8s cubic-bezier(.16,1,.3,1);
      pointer-events: auto;
    }

    .contact.visible { opacity: 1; transform: translateY(0); }

    .contact a {
      color: #ffffff; text-decoration: none;
      font-size: 0.95rem; letter-spacing: 0.04em;
      position: relative; padding-bottom: 2px;
    }

    .contact a::after {
      content: ''; position: absolute;
      bottom: 0; left: 50%;
      width: 0; height: 1px;
      background: rgba(255,255,255,0.6);
      transition: all .3s ease;
      transform: translateX(-50%);
    }

    .contact a:hover::after { width: 100%; }
    .separator { margin: 0 1rem; opacity: 0.4; }

    footer {
      display: flex; justify-content: center; align-items: center;
      gap: 2rem; padding: 1.2rem 2rem; font-size: 0.75rem;
      position: relative; z-index: 1;
      opacity: 0; transition: opacity .8s ease;
    }

    footer.visible { opacity: 1; }

    footer a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color .3s ease;
    }

    footer a:hover { color: rgba(255,255,255,0.8); }
    .copyright { color: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <main>
    <div class="hero">
      <p class="tagline" id="tagline"></p>
      <div class="divider" id="divider"></div>
      <div class="contact" id="contact">
        <a href="mailto:martin@zwinny.se">martin@zwinny.se</a>
        <span class="separator">&middot;</span>
        <a href="tel:+46105200553">010-520 05 53</a>
      </div>
    </div>
  </main>

  <footer id="footer">
    <a href="privacy.html">Integritetspolicy</a>
    <span class="copyright">&copy; 2026 Zwinny AB</span>
  </footer>

  <script src="animation.js?v=12"></script>
</body>
</html>
